# Posts the report generated by the bundle-size workflow on the PR.
# It runs in a separate workflow because the bundle-size workflow doesn't have the permission to comment on PRs
# opened from forks. This workflow doesn't check out nor run any code from the PR.
name: bundle-size-comment
on:
  workflow_run:
    workflows: ["bundle-size"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: "comment"
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download report
        uses: actions/download-artifact@v8
        with:
          name: bundle-size-report
          path: ${{ runner.temp }}/report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Comment on the PR
        uses: actions/github-script@v9
        env:
          REPORT_DIR: ${{ runner.temp }}/report
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const marker = '<!-- bundle-size-report -->';
            const maxLength = 65000;

            const prNumber = Number(fs.readFileSync(path.join(process.env.REPORT_DIR, 'pr-number'), 'utf8').trim());
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              core.setFailed('invalid PR number');
              return;
            }

            // Make sure the report belongs to the PR it claims to be for.
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
            if (pr.head.sha !== context.payload.workflow_run.head_sha) {
              core.info(`PR #${prNumber} head (${pr.head.sha}) doesn't match the workflow run, skipping.`);
              return;
            }

            let report = fs.readFileSync(path.join(process.env.REPORT_DIR, 'report.md'), 'utf8');
            if (report.length > maxLength) {
              report = `${report.slice(0, maxLength)}\n\n_Report truncated, see the [workflow run](${context.payload.workflow_run.html_url})._`;
            }
            const body = `${marker}\n${report}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber, body });
            }
