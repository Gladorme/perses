# Minimal JSON HTTP API used to test the JsonDatasource plugin.
# Static JSON documents are served from ./data, plus a dynamic endpoint returning the server time.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  default_type application/json;

  # Allow the JsonDatasource to be used with `directUrl` (browser -> API) as well as through the Perses proxy.
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
  add_header Access-Control-Allow-Headers "*" always;

  if ($request_method = OPTIONS) {
    return 204;
  }

  location = / {
    return 200 '{"endpoints":["/api/services.json","/api/incidents.json","/api/now"]}';
  }

  location = /api/now {
    return 200 '{"time":"$time_iso8601","epochSeconds":$msec,"requestId":"$request_id"}';
  }

  location /api/ {
    alias /usr/share/nginx/html/;
    # POST requests on static files are not allowed by default in nginx, serve them as GET.
    error_page 405 =200 $uri;
  }
}
