# OpenTelemetry Collector writing the telemetry received from the gateway (otel-gateway.yaml) into ClickHouse.
# The exporter creates the `otel` database and the otel_logs, otel_traces and otel_metrics_* tables at startup.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    create_schema: true
    ttl: 72h
    sending_queue: { batch: {} }

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [clickhouse]
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [clickhouse]
  telemetry:
    logs:
      level: warn
      disable_stacktrace: true
