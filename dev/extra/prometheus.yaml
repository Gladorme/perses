global:
  scrape_interval:     15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Metrics pushed through the OTLP receiver (OTel Demo and synthetic generators, via the otel-gateway collector)
otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - deployment.environment.name
    - container.name
    - host.name
    - postgresql.database.name
    - postgresql.table.name
    - kafka.cluster.alias

storage:
  tsdb:
    out_of_order_time_window: 30m

rule_files:
  - /etc/alerting-rules.yaml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
  - job_name: 'tempo'
    static_configs:
      - targets: [ 'tempo:3200' ]
  - job_name: 'avalanche'
    static_configs:
      - targets: [ 'avalanche:9001' ]
    metric_relabel_configs:
      # Remove leak on native histograms, maybe others too
      - action: labeldrop
        regex: cycle_id