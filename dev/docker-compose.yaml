# Every service of this file is attached to one or more profiles, so you pick the backends you want to work with:
#   docker compose --file dev/docker-compose.yaml --profile <profile> [--profile <profile> ...] up --detach
# (or export COMPOSE_PROFILES=prometheus,tempo,... and run `docker compose --file dev/docker-compose.yaml up --detach`)
# Stop everything with: docker compose --file dev/docker-compose.yaml --profile "*" down
#
# The matching datasources (named <Backend>Local) are provisioned from dev/data/4-globaldatasource.json.
#
# | Profile      | Backend (host port)                                         | Data                                         |
# |--------------|-------------------------------------------------------------|----------------------------------------------|
# | prometheus   | Prometheus (9090)                                           | scrapes itself, Tempo and avalanche          |
# | avalanche    | -                                                           | fake Prometheus metrics                      |
# | alertmanager | Alertmanager (9093)                                         | alerts from Prometheus + a few silences      |
# | tempo        | Tempo (3200)                                                | fake traces (k6)                             |
# | loki         | Loki (3100)                                                 | fake logs (flog + promtail)                  |
# | pyroscope    | Pyroscope (4040)                                            | profiles of Pyroscope/Alloy (alloy)          |
# | jaeger       | Jaeger (16686)                                              | synthetic traces (telemetrygen)              |
# | clickhouse   | ClickHouse (8123)                                           | synthetic logs/traces/metrics (telemetrygen) |
# | opensearch   | OpenSearch (9200)                                           | synthetic logs (telemetrygen)                |
# | greptimedb   | GreptimeDB (4000)                                           | synthetic logs/traces/metrics (telemetrygen) |
# | victorialogs | VictoriaLogs (9428)                                         | synthetic logs (telemetrygen)                |
# | splunk       | Splunk (UI 8000, API 8089) - heavy, amd64 only, slow boot   | synthetic logs (telemetrygen)                |
# | json         | Static JSON HTTP API (8070)                                 | JSON documents from extra/json-api           |
# | otel-demo    | OpenTelemetry Demo (web store on 8081) + Prometheus, Tempo  | real metrics, traces and logs sent to every  |
# |              | and Loki                                                    | running backend (see otel-demo/compose.yaml) |
# | postgres     | PostgreSQL (5432), to use as Perses database                | -                                            |
# | all          | everything above, except postgres and splunk                |                                              |
#
# Examples:
#   - All signals with real data:   docker compose --file dev/docker-compose.yaml --profile otel-demo up --detach
#   - Same, also in VictoriaLogs:   docker compose --file dev/docker-compose.yaml --profile otel-demo --profile victorialogs up --detach
#   - Prometheus and Tempo:         docker compose --file dev/docker-compose.yaml --profile prometheus --profile avalanche --profile tempo up --detach
#   - Alertmanager:                 docker compose --file dev/docker-compose.yaml --profile prometheus --profile alertmanager up --detach
#
# Telemetry flow of the OTel Demo and of the synthetic generators:
#   demo services -> otel-collector (otel-demo/otelcol-config.yaml) -> otel-gateway (extra/otel-gateway.yaml)
#   telemetrygen-* ---------------------------------------------------> otel-gateway -> every running backend

name: "perses-dev"

include:
  - otel-demo/compose.yaml

services:
  loki:
    image: grafana/loki:3.6
    ports:
      - "3100:3100"
    profiles: [loki, otel-demo, all]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./extra/loki-data:/loki

  promtail:
    image: grafana/promtail:3.6
    profiles: [loki, all]
    volumes:
      - ./extra/promtail.yaml:/etc/promtail/config.yaml
      - ./extra/logs:/var/log/fake
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
      - log-generator

  log-generator:
    image: mingrammer/flog:0.4.3
    profiles: [loki, all]
    volumes:
      - ./extra/logs:/var/log/output
    command:
      - --loop
      - --format=json
      - --type=log
      - --number=10
      - --delay=100ms
      - --output=/var/log/output/fake.log
      - --overwrite

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: perses
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    profiles: [postgres]

  prometheus:
    image: prom/prometheus:v3
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./extra/prometheus.yaml:/etc/prometheus.yaml
      - ./extra/alerting-rules.yaml:/etc/alerting-rules.yaml
    ports:
      - "9090:9090"
    profiles: [prometheus, otel-demo, all]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
    volumes:
      - ./extra/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml
    ports:
      - "9093:9093"
    profiles: [alertmanager, all]

  alertmanager-init:
    image: curlimages/curl:8.13.0
    profiles: [alertmanager, all]
    depends_on:
      - alertmanager
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        NOW=$$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
        FUTURE_EPOCH=$$(( $$(date +%s) + 2592000 ))
        FUTURE=$$(date -u -d @$$FUTURE_EPOCH +%Y-%m-%dT%H:%M:%S.000Z 2>/dev/null || date -u -r $$FUTURE_EPOCH +%Y-%m-%dT%H:%M:%S.000Z 2>/dev/null)
        echo "NOW=$$NOW FUTURE=$$FUTURE"

        curl -s -X POST http://alertmanager:9093/api/v2/silences \
          -H 'Content-Type: application/json' \
          -d '{"matchers":[{"name":"alertname","value":"ServiceErrorRate","isRegex":false,"isEqual":true}],"startsAt":"'"$$NOW"'","endsAt":"'"$$FUTURE"'","createdBy":"dev-setup","comment":"Silenced for dev testing"}'

        curl -s -X POST http://alertmanager:9093/api/v2/silences \
          -H 'Content-Type: application/json' \
          -d '{"matchers":[{"name":"alertname","value":"AvalancheCounterGrowing","isRegex":false,"isEqual":true}],"startsAt":"'"$$NOW"'","endsAt":"'"$$FUTURE"'","createdBy":"dev-setup","comment":"Silenced for dev testing — counter growth is expected"}'

        curl -s -X POST http://alertmanager:9093/api/v2/silences \
          -H 'Content-Type: application/json' \
          -d '{"matchers":[{"name":"team","value":"app-backend","isRegex":false,"isEqual":true},{"name":"severity","value":"info","isRegex":false,"isEqual":true}],"startsAt":"'"$$NOW"'","endsAt":"'"$$FUTURE"'","createdBy":"oncall-bot","comment":"Suppress low-priority app-backend alerts during dev"}'

        echo 'Silences created successfully'

  # Generate fake metrics
  avalanche:
    image: quay.io/prometheuscommunity/avalanche:v0.7.0
    command:
      - "--gauge-metric-count=5"
      - "--counter-metric-count=5"
      - "--histogram-metric-count=5"
      - "--histogram-metric-bucket-count=5"
      - "--native-histogram-metric-count=5"
      - "--summary-metric-count=5"
      - "--summary-metric-objective-count=5"
      - "--label-count=5"
      - "--series-count=100"
    ports:
      - "9001:9001"
    profiles: [avalanche, all]

  memcached:
    image: memcached:1.6.29
    container_name: memcached
    ports:
      - "11211:11211"
    environment:
      - MEMCACHED_MAX_MEMORY=64m # Set the maximum memory usage
      - MEMCACHED_THREADS=4 # Number of threads to use
    profiles: [tempo, otel-demo, all]

  tempo:
    image: grafana/tempo:2.10.3
    command: ["-config.file=/etc/tempo.yaml"]
    user: "10001:10001"
    volumes:
      - ./extra/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "14268:14268" # jaeger ingest
      - "3200:3200" # tempo
      - "9095:9095" # tempo grpc
      - "4317:4317" # otlp grpc
      - "4318:4318" # otlp http
      - "9411:9411" # zipkin
    depends_on:
      - memcached
    profiles: [tempo, otel-demo, all]

  k6-tracing:
    image: ghcr.io/grafana/xk6-client-tracing:v0.0.5
    environment:
      - ENDPOINT=tempo:4317
    restart: always
    depends_on:
      - tempo
    profiles: [tempo, all]

  # Continuous profiling backend
  pyroscope:
    image: grafana/pyroscope:1.14.0
    ports:
      - '4040:4040'
    profiles: [pyroscope, all]

  # Generate fake profiling data by scraping pprof endpoints and pushing them to Pyroscope
  pyroscope-generator:
    image: grafana/alloy:v1.11.0
    volumes:
      - ./extra/alloy-pyroscope.alloy:/etc/alloy/config.alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - pyroscope
    profiles: [pyroscope, all]

  # Distributed tracing backend.
  # Pinned to 2.20: Jaeger 2.21 removed the internal `/api/*` HTTP endpoints used by the Jaeger datasource plugin.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686" # UI and HTTP API
    profiles: [jaeger, all]

  # Column-oriented database, storing logs, traces and metrics (OpenTelemetry schema, `otel` database)
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      # Allow the passwordless `default` user to connect from the network
      - CLICKHOUSE_SKIP_USER_SETUP=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123" # HTTP interface
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: [clickhouse, all]

  # Writes the telemetry received from otel-gateway into ClickHouse
  otel-clickhouse:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./extra/otel-clickhouse.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles: [clickhouse, all]

  # Search engine, storing logs in the `otel-logs-*` indices
  opensearch:
    image: opensearchproject/opensearch:3.10.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # Workaround for JVM crashes on Apple M4 (https://bugs.openjdk.org/browse/JDK-8345296):
      # export _JAVA_OPTIONS="-XX:UseSVE=0" before starting the stack.
      - _JAVA_OPTIONS
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    healthcheck:
      test: curl -s http://localhost:9200/_cluster/health | grep -E '"status":"(green|yellow)"'
      start_period: 20s
      interval: 5s
      timeout: 10s
      retries: 20
    profiles: [opensearch, all]

  # Keeps dotted OpenTelemetry attribute names (e.g. `http.request.method`) as flat fields, so that attributes like
  # `http` and `http.request.method` don't produce conflicting mappings.
  opensearch-init:
    image: curlimages/curl:8.13.0
    volumes:
      - ./extra/opensearch/otel-logs-template.json:/otel-logs-template.json:ro
    command:
      - --fail-with-body
      - --silent
      - --show-error
      - --request
      - PUT
      - --header
      - "Content-Type: application/json"
      - --data
      - "@/otel-logs-template.json"
      - http://opensearch:9200/_index_template/otel-logs
    depends_on:
      opensearch:
        condition: service_healthy
    profiles: [opensearch, all]

  # Time-series database, storing logs, traces and metrics (`public` database)
  greptimedb:
    image: greptime/greptimedb:v1.3.1
    command:
      - standalone
      - start
      - --http-addr=0.0.0.0:4000
      - --grpc-bind-addr=0.0.0.0:4001
      - --mysql-addr=0.0.0.0:4002
      - --postgres-addr=0.0.0.0:4003
    ports:
      - "4000:4000" # HTTP API
    profiles: [greptimedb, all]

  # Logs database
  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0
    ports:
      - "9428:9428"
    profiles: [victorialogs, all]

  # Splunk Enterprise (trial license). The image is only available for amd64 and needs a few minutes to start.
  # UI: http://localhost:8000 (admin / perses-dev-password)
  splunk:
    image: splunk/splunk:10.4
    platform: linux/amd64
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=perses-dev-password
      - SPLUNK_HEC_TOKEN=00000000-0000-0000-0000-000000000000
    ports:
      - "8000:8000" # UI
      - "8089:8089" # REST API (HTTPS)
    profiles: [splunk]

  # Static JSON HTTP API, to test the JsonDatasource
  json-api:
    image: nginx:1.29-alpine
    volumes:
      - ./extra/json-api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./extra/json-api/data:/usr/share/nginx/html:ro
    ports:
      - "8070:80"
    profiles: [json, all]

  # Collector receiving the telemetry of the OTel Demo and of the synthetic generators below,
  # and forwarding it to every datasource backend that is running.
  otel-gateway:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./extra/otel-gateway.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
    # Backends are optional (only started with their profile): wait for the ones that are enabled.
    depends_on:
      prometheus: { condition: service_started, required: false }
      tempo: { condition: service_started, required: false }
      loki: { condition: service_started, required: false }
      jaeger: { condition: service_started, required: false }
      otel-clickhouse: { condition: service_started, required: false }
      opensearch-init: { condition: service_completed_successfully, required: false }
      greptimedb: { condition: service_started, required: false }
      victorialogs: { condition: service_started, required: false }
      splunk: { condition: service_started, required: false }
    profiles: [otel-demo, jaeger, clickhouse, opensearch, greptimedb, victorialogs, splunk, all]

  # Synthetic telemetry for the backends that have no dedicated data generator.
  # Use the otel-demo profile to get realistic data instead.
  telemetrygen-traces:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.159.0
    command:
      - traces
      - --otlp-endpoint=otel-gateway:4317
      - --otlp-insecure
      - --duration=inf
      - --rate=2
      - --child-spans=4
      - --span-duration=25ms
      - --service=telemetrygen
    restart: unless-stopped
    depends_on:
      - otel-gateway
    profiles: [jaeger, clickhouse, greptimedb, all]

  telemetrygen-logs:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.159.0
    command:
      - logs
      - --otlp-endpoint=otel-gateway:4317
      - --otlp-insecure
      - --duration=inf
      - --rate=5
      - --service=telemetrygen
      - --body=GET /api/products 200 - synthetic log generated by telemetrygen
      - --telemetry-attributes=http.request.method="GET"
      - --telemetry-attributes=http.route="/api/products"
    restart: unless-stopped
    depends_on:
      - otel-gateway
    profiles: [clickhouse, opensearch, greptimedb, victorialogs, splunk, all]

  telemetrygen-metrics:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.159.0
    command:
      - metrics
      - --otlp-endpoint=otel-gateway:4317
      - --otlp-insecure
      - --duration=inf
      - --rate=1
      - --metric-type=Sum
      - --service=telemetrygen
    restart: unless-stopped
    depends_on:
      - otel-gateway
    profiles: [clickhouse, greptimedb, all]

volumes:
  tempo-data:
