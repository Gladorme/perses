extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:

connectors:
  span_metrics:
    exemplars:
      enabled: true
    metrics_flush_interval: 5s

exporters:
  clickhouse/clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: otel
    async_insert: true
    create_schema: true
    ttl: 72h
    compress: lz4
    timeout: 10s
  nop/clickhouse:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: ['${env:CLICKHOUSE_EXPORTER_TYPE}/clickhouse', otlp/tempo, span_metrics]
    metrics:
      receivers: [otlp, span_metrics]
      processors: [memory_limiter, batch]
      exporters: ['${env:CLICKHOUSE_EXPORTER_TYPE}/clickhouse', otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: ['${env:CLICKHOUSE_EXPORTER_TYPE}/clickhouse', otlphttp/loki]
